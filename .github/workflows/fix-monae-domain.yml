name: Fix Monae Rose website spelling

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-monae-domain.yml'

permissions:
  contents: write

jobs:
  fix-domain:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Correct Monae Rose website spelling inside portfolio archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _monae_fix
          mkdir _monae_fix
          unzip -q Kayaswanna_Portfolio_GitHubLite.zip -d _monae_fix

          mapfile -t files < <(grep -RIl --exclude='*.zip' 'OfficialMonetRose' _monae_fix || true)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'No OfficialMonetRose typo found in archive.'
            exit 0
          fi

          for file in "${files[@]}"; do
            sed -i 's/OfficialMonetRose/OfficialMonaeRose/g' "$file"
          done

          if grep -RIl --exclude='*.zip' 'OfficialMonetRose' _monae_fix | grep -q .; then
            echo 'Typo still present after replacement.'
            exit 1
          fi

          rm Kayaswanna_Portfolio_GitHubLite.zip
          (cd _monae_fix && zip -qr ../Kayaswanna_Portfolio_GitHubLite.zip .)
          rm -rf _monae_fix

      - name: Commit corrected portfolio archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Kayaswanna_Portfolio_GitHubLite.zip
          if git diff --cached --quiet; then
            echo 'No archive change to commit.'
            exit 0
          fi
          git commit -m 'Fix Monae Rose website spelling'
          git push
