name: Organize portfolio categories
on:
  push:
    paths:
      - '.github/workflows/organize-portfolio.yml'
permissions:
  contents: write
jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,re
          target=Path('Kayaswanna_Portfolio_GitHubLite.zip')
          with zipfile.ZipFile(target) as z:files={n:z.read(n) for n in z.namelist()}
          base='Kayaswanna_Portfolio_GitHubLite/'
          files[base+'index.html']=Path('.portfolio-organize/index.html').read_bytes()
          files.pop(base+'assets/Slow_Saturday_Morning_Comfort.mp4')
          files.pop(base+'posters/Slow_Saturday_Morning_Comfort.jpg',None)
          page=files[base+'index.html'].decode()
          sources=re.findall(r'<video\b[^>]*src="([^"]+)"',page)
          assert len(sources)==len(set(sources))==33
          assert len([n for n in files if n.endswith('.mp4')])==33
          assert all(base+s in files for s in sources)
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              for n,b in files.items():z.writestr(n,b)
          Path('README.md').write_text('# Monae UGC Portfolio\n\n33 unique videos organized into Fashion, Beauty, Fragrance & Accessories, Food & Drinks, Home & Lifestyle, Pets, and Tech + AI. Duplicate coffee export removed; RYZE appears once.\n')
          PY
          rm -rf .portfolio-organize
          rm .github/workflows/organize-portfolio.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Group portfolio by category and remove duplicate RYZE coffee export'
          git push
