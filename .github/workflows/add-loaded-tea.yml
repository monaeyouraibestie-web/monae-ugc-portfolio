name: Add Loaded Tea portfolio demo
on:
  push:
    paths:
      - '.github/workflows/add-loaded-tea.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,re
          target=Path('Kayaswanna_Portfolio_GitHubLite.zip')
          data=b''.join(p.read_bytes() for p in sorted(Path('.portfolio-tea').glob('*.part')))
          assert hashlib.sha256(data).hexdigest()=='82deb68447e0eb09624f1ea930f19f615ed4e9fcb70c72f9995cb1564c76f908'
          with zipfile.ZipFile(target) as z:files={n:z.read(n) for n in z.namelist()}
          original={n:b for n,b in files.items() if n.endswith('.mp4')}
          assert len(original)==32
          assert hashlib.sha256(data).digest() not in {hashlib.sha256(b).digest() for b in original.values()}
          base='Kayaswanna_Portfolio_GitHubLite/'
          files[base+'assets/Loaded_Tea_Product_Demo.mp4']=data
          files[base+'posters/Loaded_Tea_Product_Demo.jpg']=Path('.portfolio-tea/poster.jpg').read_bytes()
          text=files[base+'index.html'].decode()
          end=text.index('</div></div></section>',text.index('id="food"'))
          text=text[:end]+"<article class=\"card\"><div class=\"frame\" data-video=\"\" style=\"background:#000 url('posters/Loaded_Tea_Product_Demo.jpg') center/contain no-repeat;\"><video playsinline=\"\" preload=\"none\" poster=\"posters/Loaded_Tea_Product_Demo.jpg\" src=\"assets/Loaded_Tea_Product_Demo.mp4\"></video><div class=\"play-overlay\"><div class=\"play-btn\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"></path></svg></div></div></div><div class=\"card-body\"><p class=\"type\">Food &amp; Drink UGC</p><h3>Loaded Tea — Product Demo</h3><p>A casual kitchen demo showing drink preparation.</p></div></article>"+text[end:]
          sources=re.findall(r'<video\b[^>]*src="([^"]+)"',text)
          assert len(sources)==len(set(sources))==33
          files[base+'index.html']=text.encode()
          for n,b in original.items():assert files[n]==b
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              for n,b in files.items():z.writestr(n,b)
          Path('README.md').write_text('# Monae UGC Portfolio\n\n33 videos organized by category. Loaded Tea Product Demo added once in Food & Drinks; all existing videos preserved.\n')
          PY
          rm -rf .portfolio-tea
          rm .github/workflows/add-loaded-tea.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Loaded Tea demo to Food & Drinks, preserving all existing videos'
          git push
