name: Add STRUT NOIR portfolio ad
on:
  push:
    paths:
      - '.github/workflows/add-strut-noir.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,re
          target=Path('Kayaswanna_Portfolio_GitHubLite.zip')
          data=b''.join(p.read_bytes() for p in sorted(Path('.portfolio-strut').glob('*.part')))
          assert hashlib.sha256(data).hexdigest()=='32d5b78c2d37764ed6e9e7e5ecc3e521d6aa607e62e89cff615f69b9c0ca9bbd'
          with zipfile.ZipFile(target) as z:files={n:z.read(n) for n in z.namelist()}
          original={n:b for n,b in files.items() if n.endswith('.mp4')}
          assert len(original)==33
          assert hashlib.sha256(data).digest() not in {hashlib.sha256(b).digest() for b in original.values()}
          base='Kayaswanna_Portfolio_GitHubLite/'
          files[base+'assets/STRUT_NOIR_Shoe_Cam_UGC_Ad.mp4']=data
          files[base+'posters/STRUT_NOIR_Shoe_Cam_UGC_Ad.jpg']=Path('.portfolio-strut/poster.jpg').read_bytes()
          text=files[base+'index.html'].decode()
          end=text.index('</div></div></section>',text.index('id="latest"'))
          text=text[:end]+"<article class=\"card\"><div class=\"frame\" data-video=\"\" style=\"background:#000 url('posters/STRUT_NOIR_Shoe_Cam_UGC_Ad.jpg') center/contain no-repeat;\"><video playsinline=\"\" preload=\"none\" poster=\"posters/STRUT_NOIR_Shoe_Cam_UGC_Ad.jpg\" src=\"assets/STRUT_NOIR_Shoe_Cam_UGC_Ad.mp4\"></video><div class=\"play-overlay\"><div class=\"play-btn\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"></path></svg></div></div></div><div class=\"card-body\"><p class=\"type\">Fashion UGC</p><h3>STRUT NOIR — Shoe Cam</h3><p>A cinematic shoe campaign with bold styling and a confident strut.</p></div></article>"+text[end:]
          sources=re.findall(r'<video\b[^>]*src="([^"]+)"',text)
          assert len(sources)==len(set(sources))==34
          files[base+'index.html']=text.encode()
          for n,b in original.items():assert files[n]==b
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              for n,b in files.items():z.writestr(n,b)
          Path('README.md').write_text('# Monae UGC Portfolio\n\nUpdated October 5, 2026: 34 unique videos. All existing videos preserved; STRUT NOIR Shoe Cam added once.\n')
          PY
          rm -rf .portfolio-strut
          rm .github/workflows/add-strut-noir.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add STRUT NOIR Shoe Cam ad, preserving all 33 existing videos'
          git push
