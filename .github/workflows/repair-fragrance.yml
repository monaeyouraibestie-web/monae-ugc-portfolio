name: Repair fragrance playback
on:
  push:
    paths:
      - '.github/workflows/repair-fragrance.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,subprocess,tempfile,re
          target=Path('Kayaswanna_Portfolio_GitHubLite.zip')
          data=b''.join(p.read_bytes() for p in sorted(Path('.portfolio-repair').glob('*.part')))
          assert hashlib.sha256(data).hexdigest()=='f424dd66ebb6d9d963d149eb9c82cb54325756ca70afa00bf504a4dbfc8b89b5'
          with zipfile.ZipFile(target) as z:
              files={n:z.read(n) for n in z.namelist()}
          files['Kayaswanna_Portfolio_GitHubLite/assets/Mens_Fragrance_UGC.mp4']=data
          for n,b in files.items():
              if n.endswith('.mp4'):
                  Path('/tmp/verify.mp4').write_bytes(b)
                  result=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0','/tmp/verify.mp4'],capture_output=True,text=True,check=True)
                  assert float(result.stdout)>0,n
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              for n,b in files.items():z.writestr(n,b)
          PY
          rm -rf .portfolio-repair
          rm .github/workflows/repair-fragrance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore verified original fragrance video and validate every clip'
          git push
