name: Remove duplicate male watch listing
on:
  push:
    paths:
      - '.github/workflows/dedupe-watch.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,re
          target=Path('Kayaswanna_Portfolio_GitHubLite.zip')
          with zipfile.ZipFile(target) as z:files={n:z.read(n) for n in z.namelist()}
          base='Kayaswanna_Portfolio_GitHubLite/'
          page=files[base+'index.html'].decode()
          articles=re.findall(r'<article\b.*?</article>',page,re.S)
          matches=[a for a in articles if 'src="assets/Luxury_Watch.mp4"' in a]
          assert len(matches)==1
          page=page.replace(matches[0],'',1)
          assert page.count('src="assets/Boss_Energy.mp4"')==1
          assert 'src="assets/Luxury_Watch.mp4"' not in page
          sources=re.findall(r'<video\b[^>]*src="([^"]+)"',page)
          assert len(sources)==len(set(sources))==32
          files[base+'index.html']=page.encode()
          files.pop(base+'assets/Luxury_Watch.mp4')
          files.pop(base+'posters/Luxury_Watch.jpg',None)
          assert len([n for n in files if n.endswith('.mp4')])==32
          with zipfile.ZipFile(target,'w',zipfile.ZIP_DEFLATED) as z:
              for n,b in files.items():z.writestr(n,b)
          Path('README.md').write_text('# Monae UGC Portfolio\n\n32 videos organized by category. Duplicate coffee and male watch listings removed. Boss Energy watch kept once in Fragrance & Accessories.\n')
          PY
          rm .github/workflows/dedupe-watch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove duplicate male watch, keeping Boss Energy once'
          git push
